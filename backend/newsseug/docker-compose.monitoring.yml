services:
  
  prometheus: 
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    networks:
      - monitor-net

  # EC2 인스턴스 내 Linux 환경에서만 사용 가능
#  node-exporter:
#    image: prom/node-exporter:latest
#    container_name: node-exporter
#    restart: unless-stopped
#    ports:
#      - "9100:9100"
#    network_mode: host  # 시스템 리소스를 직접 보기 위함 (Docker for Mac은 예외 있음)

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    networks:
      - monitor-net

networks:
#  newsseug_newsseug-net:
#    external: true  # 이미 사용 중인 네트워크를 사용
  monitor-net:
    driver: bridge